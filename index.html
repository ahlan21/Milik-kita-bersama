<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3B31">
<style>:root{color-scheme:light}html,body{margin:0}</style>
<title>Milik Kita Bersama</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: sidebar + konten di laptop; bilah bawah dengan tombol Catat di tengah pada HP. */
:root {
  --bg: #F4F8F6;
  --surface: #FFFFFF;
  --surface2: #EAF1EE;
  --fg: #10201B;
  --muted: #566861;
  --line: #DAE4DF;
  --brand: #0B6B4C;
  --brand-fg: #FFFFFF;
  --brand-soft: #DDF1E8;
  --amber: #E8A23A;
  --in-ink: #0B6B4C;
  --out-ink: #B2431B;
  --danger: #B3261E;
  --series-in: #1BAF7A;
  --series-out: #EB6834;
  --grid: #E3EBE7;
  --intro-bg: #0B3B31;
  --chip-s: 55%; --chip-s2: 60%; --chip-bg-l: 90%; --chip-fg-l: 26%;
  --shadow: 0 12px 32px rgba(16, 32, 27, .14);
  --font-display: "Plus Jakarta Sans", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1412; --surface: #131F1B; --surface2: #1B2B26; --fg: #E6F0EC; --muted: #9DB2AA; --line: #263832;
    --brand: #3DC796; --brand-fg: #06211A; --brand-soft: #12322A; --in-ink: #5FD8AC; --out-ink: #FF9E78; --danger: #F2897F;
    --series-in: #199E70; --series-out: #D95926; --grid: #22332D;
    --chip-s: 40%; --chip-s2: 70%; --chip-bg-l: 22%; --chip-fg-l: 82%;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1412; --surface: #131F1B; --surface2: #1B2B26; --fg: #E6F0EC; --muted: #9DB2AA; --line: #263832;
  --brand: #3DC796; --brand-fg: #06211A; --brand-soft: #12322A; --in-ink: #5FD8AC; --out-ink: #FF9E78; --danger: #F2897F;
  --series-in: #199E70; --series-out: #D95926; --grid: #22332D;
  --chip-s: 40%; --chip-s2: 70%; --chip-bg-l: 22%; --chip-fg-l: 82%;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 1.35em; height: 1.35em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ===== Animasi masuk ===== */
.intro { position: fixed; inset: 0; z-index: 100; background: var(--intro-bg); display: grid; place-items: center; align-content: center; gap: 22px; text-align: center; color: #F2FBF7; padding: 24px;
  animation: introOut .5s ease 2.5s forwards; cursor: pointer; }
.intro svg { width: 132px; height: 132px; overflow: visible; }
.intro .ca { fill: #2DD4A7; animation: slideA .9s cubic-bezier(.2, .8, .2, 1) .1s both; }
.intro .cb { fill: #F5B544; animation: slideB .9s cubic-bezier(.2, .8, .2, 1) .1s both; }
.intro .cl { fill: #FFF6DD; transform-box: fill-box; transform-origin: center; animation: lens .55s cubic-bezier(.3, 1.4, .5, 1) .85s both; }
.intro .ring { fill: none; stroke: #F5B544; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ping 1s ease-out 1s forwards; }
.intro h1 { font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 800; letter-spacing: -.02em; animation: rise .6s ease 1.1s both; }
.intro h1 span { color: #F5B544; }
.intro p { color: #A9D8C8; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; font-weight: 500; animation: rise .6s ease 1.35s both; }
.intro .skip { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); font-size: .8rem; color: #7FB5A3; animation: rise .4s ease 1.6s both; }
.intro.gone { display: none; }
@keyframes slideA { from { transform: translateX(-34px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideB { from { transform: translateX(34px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lens { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ping { 0% { transform: scale(.8); opacity: .8; } 100% { transform: scale(2.1); opacity: 0; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes introOut { to { opacity: 0; visibility: hidden; } }
@media (prefers-reduced-motion: reduce) {
  .intro { animation: introOut .3s ease 1.2s forwards; }
  .intro .ca, .intro .cb, .intro .cl, .intro h1, .intro p, .intro .skip { animation: none; }
  .intro .ring { display: none; }
}

/* ===== Kerangka ===== */
.app { max-width: 1180px; margin-inline: auto; display: block; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; background: var(--bg); }
.brandrow { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brandrow svg.logo { width: 38px; height: 38px; flex: none; }
.brandrow b { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; line-height: 1.1; display: block; }
.brandrow small { color: var(--muted); font-size: .78rem; display: block; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.x { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; width: 40px; height: 40px; display: inline-grid; place-items: center; }
.x:disabled { opacity: .4; cursor: not-allowed; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav-brand, .nav-foot { display: none; }
.nbtn { border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: .72rem; font-weight: 600; border-radius: 12px; }
.nbtn[aria-current="page"] { color: var(--brand); }
.nbtn.fab { color: var(--brand-fg); }
.nbtn.fab .fabc { width: 54px; height: 54px; margin-top: -26px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; box-shadow: var(--shadow); border: 4px solid var(--surface); }
.nbtn.fab .fabc svg { width: 26px; height: 26px; }
.nbtn.fab span.l { color: var(--muted); }
main { padding-block: 6px 120px; min-width: 0; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.phead h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
.sub { color: var(--muted); font-size: .92rem; }
.mswitch { display: inline-flex; align-items: center; gap: 6px; }
.mlabel { min-width: 9.5em; text-align: center; font-weight: 700; font-family: var(--font-display); text-transform: capitalize; }

/* ===== Komponen ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
.card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; }
.stack { display: grid; gap: 16px; }
.cols2 { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.hero { background: var(--intro-bg); color: #F2FBF7; border-radius: 22px; padding: 22px; display: grid; gap: 6px; position: relative; overflow: hidden; }
.hero small { color: #A9D8C8; font-weight: 500; }
.hero .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 8vw, 2.8rem); letter-spacing: -.03em; line-height: 1.1; }
.hero .bar { height: 8px; background: rgba(255, 255, 255, .16); border-radius: 4px; overflow: hidden; margin-top: 10px; }
.hero .bar i { display: block; height: 100%; background: #F5B544; border-radius: 4px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 2px; min-width: 0; }
.tile .l { color: var(--muted); font-size: .82rem; display: flex; align-items: center; gap: 6px; }
.tile .v { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -.01em; overflow-wrap: anywhere; }
.tile.tin .v { color: var(--in-ink); } .tile.tout .v { color: var(--out-ink); }
.btn { border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 700; background: var(--brand); color: var(--brand-fg); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.block { width: 100%; padding: 14px 18px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quick .btn { flex-direction: column; gap: 4px; padding: 12px 6px; font-size: .85rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.quick .btn svg { color: var(--brand); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 600; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 26px 18px; color: var(--muted); text-align: center; display: grid; gap: 12px; justify-items: center; }
.empty b { color: var(--fg); font-family: var(--font-display); font-size: 1.1rem; }
.list { display: grid; }
.dhead { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; padding: 14px 0 6px; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: none; border-top: 1px solid var(--line); padding: 12px 2px; }
.row:first-child { border-top: 0; }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .s { color: var(--muted); font-size: .82rem; }
.amt { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.inc { color: var(--in-ink); } .amt.exp { color: var(--out-ink); }
.cat { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-family: var(--font-display);
  background: hsl(var(--h) var(--chip-s) var(--chip-bg-l)); color: hsl(var(--h) var(--chip-s2) var(--chip-fg-l)); }
.tag { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--surface2); color: var(--muted); }
.tag.sample { background: var(--brand-soft); color: var(--in-ink); }
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--brand-soft); border-radius: 14px; padding: 10px 14px; font-size: .9rem; margin-bottom: 14px; }
.banner.warn { background: var(--surface2); }
.in, select.in, textarea.in { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 13px; min-width: 0; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span, .lbl { font-size: .82rem; font-weight: 700; color: var(--muted); }
.hint { font-size: .85rem; color: var(--muted); }
.msg { min-height: 1.3em; font-size: .9rem; font-weight: 600; color: var(--danger); }
.msg.ok { color: var(--in-ink); }

/* Mau beli */
.wform { display: grid; gap: 10px; grid-template-columns: 1fr; }
.wrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.wrow:first-child { border-top: 0; }
.wrow .n { font-weight: 600; overflow-wrap: anywhere; }
.wrow.done .n { text-decoration: line-through; color: var(--muted); }
.cb { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--brand-fg); }
.cb[aria-checked="true"] { background: var(--brand); border-color: var(--brand); }
.cb svg { width: 16px; height: 16px; stroke-width: 3; }
.prio { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
.prio.penting { background: var(--out-ink); color: var(--surface); }
.prio.biasa, .prio.nanti { background: var(--surface2); color: var(--muted); }
.acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: .82rem; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }

/* Analisis */
.stats { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
.insight { display: grid; grid-template-columns: 5.6em minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.insight:first-of-type { border-top: 0; padding-top: 0; }
.ibadge { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; display: inline-flex; justify-content: center; gap: 4px; align-items: center; background: var(--surface2); }
.ibadge.good { background: var(--brand-soft); color: var(--in-ink); }
.ibadge.warn { background: var(--out-ink); color: var(--surface); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; margin-bottom: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chartbox { position: relative; }
.chartbox svg { display: block; width: 100%; height: auto; }
.axl { font-size: 11px; fill: var(--muted); font-family: var(--font-body); }
.grid line { stroke: var(--grid); stroke-width: 1; }
.sin { fill: var(--series-in); } .sout { fill: var(--series-out); }
.selband { fill: var(--surface2); }
.hit { fill: transparent; cursor: pointer; }
.hit:focus-visible { outline: none; stroke: var(--brand); stroke-width: 2; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: .82rem; transform: translate(-50%, -100%); white-space: nowrap; }
.tip b { display: block; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 8px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.catrow { display: grid; grid-template-columns: minmax(0, 8.5em) minmax(0, 1fr) 11em; gap: 10px; align-items: center; padding: 7px 0; font-size: .9rem; }
.catrow .tr { height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; }
.catrow .tr i { display: block; height: 100%; background: var(--series-out); border-radius: 0 4px 4px 0; min-width: 4px; }
.catrow .nm { overflow-wrap: anywhere; font-weight: 500; }
.catrow .vl { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.catrow .dl { display: block; font-size: .75rem; color: var(--muted); font-weight: 500; }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(5, 15, 12, .55); }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); animation: sheetIn .25s ease; }
@keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet-head h2 { font-size: 1.3rem; font-weight: 800; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 10px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.seg.out button[aria-pressed="true"] { color: var(--out-ink); } .seg.inn button[aria-pressed="true"] { color: var(--in-ink); }
.draft { display: grid; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; margin-top: 12px; position: relative; }
.draft .g2 { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.amtwrap { position: relative; }
.amtwrap b { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; }
.amtwrap input { padding-left: 42px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.voice { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 6px 0 2px; }
.mic { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--brand); color: var(--brand-fg); display: grid; place-items: center; position: relative; }
.mic svg { width: 36px; height: 36px; }
.mic.live { background: var(--danger); }
.mic.live::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--danger); opacity: .5; animation: pulse 1.2s ease-out infinite; }
@keyframes pulse { from { transform: scale(.9); opacity: .6; } to { transform: scale(1.25); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mic.live::after { animation: none; } .sheet { animation: none; } }
.said { min-height: 76px; resize: vertical; text-align: left; }
.egs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.eg { border: 1px dashed var(--line); background: none; border-radius: 99px; padding: 5px 12px; font-size: .82rem; color: var(--muted); }
.foot { display: grid; gap: 10px; margin-top: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); display: flex; gap: 12px; align-items: center; }
.toast button { border: 0; background: none; color: var(--amber); font-weight: 700; padding: 0; }
.skel { height: 120px; border-radius: 18px; background: var(--surface2); }
body.ro .w { display: none !important; }

@media (min-width: 700px) {
  .stats { grid-template-columns: repeat(4, 1fr); }
  .wform { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; align-items: end; }
  .sheet-wrap { align-items: center; }
  .sheet { border-radius: 22px; }
}
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 32px; align-items: start; }
  .top { display: none; }
  .nav { position: sticky; top: 0; left: auto; right: auto; bottom: auto; z-index: 5; display: flex; flex-direction: column; align-items: stretch; gap: 4px; background: transparent; border: 0; padding: 28px 0; height: 100dvh; }
  .nav-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; order: -2; }
  .nav-brand svg { width: 42px; height: 42px; }
  .nav-brand b { font-family: var(--font-display); font-weight: 800; line-height: 1.1; display: block; }
  .nav-brand small { color: var(--muted); font-size: .78rem; display: block; }
  .nbtn { flex-direction: row; gap: 12px; font-size: .95rem; padding: 11px 14px; justify-content: flex-start; }
  .nbtn[aria-current="page"] { background: var(--brand-soft); }
  .nbtn.fab { order: -1; background: var(--brand); color: var(--brand-fg); margin-bottom: 10px; justify-content: center; }
  .nbtn.fab .fabc { width: auto; height: auto; margin: 0; background: none; border: 0; box-shadow: none; display: inline-flex; }
  .nbtn.fab .fabc svg { width: 20px; height: 20px; }
  .nbtn.fab span.l { color: var(--brand-fg); font-size: .95rem; }
  .nav-foot { display: block; margin-top: auto; }
  .nav-foot .nbtn { width: 100%; }
  main { padding-top: 28px; padding-bottom: 60px; }
  .toast { bottom: 28px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
